        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

                        status: 'กำลังดำเนินการ (In Progress)',

        // Canonical case status options used across the list view and the report form
        const CASE_STATUSES = [
            'กำลังดำเนินการ (In Progress)',
            'ปิดคดี (Closed)',
            'หมดอายุความ (Statute of Limitations Expired)'
        ];

        // Normalizes a case record so older/legacy single-field records still render correctly
        function normalizeCase(c) {
            if (!Array.isArray(c.victims)) {
                c.victims = c.victimName ? [{ name: c.victimName, contact: '', role: '', injury: c.victimStatus || '' }] : [];
            }
            if (!Array.isArray(c.suspects)) {
                c.suspects = c.suspectName ? [{ name: c.suspectName, description: '', contact: '', locationSeen: c.suspectVehicle || '' }] : [];
            }
            if (!Array.isArray(c.witnesses)) {
                c.witnesses = c.witnessName ? [{ name: c.witnessName, contact: c.witnessContact || '', statement: '' }] : [];
            }
            if (typeof c.investigationNotes !== 'string') {
                c.investigationNotes = '';
            }
            if (!CASE_STATUSES.includes(c.status)) {
                // Map old free-text statuses onto the new canonical set
                c.status = (c.status || '').includes('ปิดคดี') || (c.status || '').includes('Closed')
                    ? 'ปิดคดี (Closed)'
                    : 'กำลังดำเนินการ (In Progress)';
            }
            return c;
        }

        // Notification Helper
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            
            const bgCol = type === 'success' ? 'bg-emerald-600 border-emerald-500' : 
                          type === 'error' ? 'bg-rose-600 border-rose-500' : 'bg-amber-600 border-amber-500';
            
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl border text-white shadow-xl flex items-center gap-3 transition-all duration-300 transform translate-y-[-20px] opacity-0 ${bgCol}`;
            
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="text-sm font-medium">${escapeHtml(message)}</span>`;
            
            container.appendChild(toast);
            
            // Fade in
            setTimeout(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
            }, 10);

            // Fade out
            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Session Management
        function getCurrentUser() {
            const session = localStorage.getItem(STORAGE_KEYS.SESSION);
            return session ? JSON.parse(session) : null;
        }

        function setCurrentUser(user) {
            if (user) {
                localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(user));
            } else {
                localStorage.removeItem(STORAGE_KEYS.SESSION);
            }
            renderApp();
        }

                                Register Officer

                        </div>

                        <div class="p-6">
                            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Name & Surname</label>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500">

                                        </span>
                                        <input type="text" id="login-name" required placeholder="Enter your full name"

                                    <div class="relative">

                                    </div>

                                            <i class="fa-solid fa-lock"></i>
                                        </span>
                                        <input type="password" id="reg-password" required placeholder="••••••••"

                                    <i class="fa-solid fa-user-plus"></i> Register New Officer
                                </button>
                            </form>
                        </div>
                        
                        <div class="px-6 py-4 bg-gray-900/40 border-t border-police-border text-center text-xs text-gray-500">

        function switchAuthTab(tab) {
            const btnLogin = document.getElementById('tab-login');
            const btnRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');

            if (tab === 'login') {
                btnLogin.className = "py-2.5 rounded-xl transition-all text-center bg-indigo-600 text-white shadow-md";
                btnRegister.className = "py-2.5 rounded-xl transition-all text-center text-gray-400 hover:text-white";
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
            } else {
                btnRegister.className = "py-2.5 rounded-xl transition-all text-center bg-emerald-600 text-white shadow-md";
                btnLogin.className = "py-2.5 rounded-xl transition-all text-center text-gray-400 hover:text-white";
                formRegister.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const nameInput = document.getElementById('login-name').value.trim();
            const password = document.getElementById('login-password').value;

            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
            const foundUser = users.find(u => u.name.toLowerCase() === nameInput.toLowerCase() && u.password === password);

            if (foundUser) {
                setCurrentUser(foundUser);
                showToast(`Welcome back, ${foundUser.name}`, 'success');
            } else {
                showToast('Invalid name or password!', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const password = document.getElementById('reg-password').value;

            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
            
            if (users.some(u => u.name.toLowerCase() === name.toLowerCase())) {
                showToast('This name is already registered in the system', 'error');
                return;
            }

            const randomIdNum = Math.floor(10000 + Math.random() * 90000);
            const callsignNum = Math.floor(10 + Math.random() * 89);
            
            const newUser = {
                id: `CID-${randomIdNum}`,
                name: name,
                callsign: `LSPD-${callsignNum}`,
                password: password
            };

            users.push(newUser);
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));

            showToast('Registration successful! Please log in with your name and password.', 'success');
            switchAuthTab('login');
            document.getElementById('form-register').reset();
        }

        let editingCaseId = null; // Case ID currently open in the form, when activeTab === 'edit-investigation'

                                <i class="fa-solid fa-scale-balanced"></i>
                                <span>Law Codes</span>

                        </div>

                        <!-- Right Profile Badge & Logout -->

                                <span class="absolute inset-0.5 rounded-full border border-white/5"></span>
                                <i class="fa-solid fa-power-off text-[13px] text-rose-500 drop-shadow-[0_0_4px_rgba(244,63,94,0.7)]"></i>
                            </button>
                        </div>
                    </header>

                    <!-- Main Dynamic Content Area -->
                    <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full">
                        <div id="tab-content">
                            <!-- Injected dynamically -->
                        </div>
                    </main>
                </div>
            `;

            renderTabContent();
        }

        function setActiveTab(tab, caseId = null) {
            activeTab = tab;
            editingCaseId = tab === 'edit-investigation' ? caseId : null;
            renderDashboardView();
        }

        function handleLogout() {
            setCurrentUser(null);
            showToast('Logged out successfully', 'info');
        }

        function renderTabContent() {
            const container = document.getElementById('tab-content');
            if (activeTab === 'law-codes') {
                container.innerHTML = getLawCodesHTML();
                initLawCodesEvents();
            } else if (activeTab === 'create-investigation') {
                container.innerHTML = getInvestigationFormHTML(null);
                initFormEvents(null);
            } else if (activeTab === 'edit-investigation') {
                container.innerHTML = getInvestigationFormHTML(editingCaseId);
                initFormEvents(editingCaseId);
            } else {
                container.innerHTML = getInvestigationListHTML();
                initInvestigationListEvents();
            }

        function renderLawChapters(filterText = '') {
            const container = document.getElementById('law-chapters-container');
            if (!container) return;
            const q = filterText.trim().toLowerCase();

            const html = LAW_CHAPTERS.map(chapter => {
                const rows = q
                    ? chapter.rows.filter(r =>
                        r[0].toLowerCase().includes(q) ||
                        r[1].toLowerCase().includes(q) ||
                        r[4].toLowerCase().includes(q))
                    : chapter.rows;

                if (rows.length === 0) return '';

                const rowsHtml = rows.map(r => {
                    const [code, offense, jail, fine, level] = r;
                    const style = levelStyle(level);
                    return `
                        <div class="relative flex items-center gap-3 pl-4 pr-3 py-2.5 rounded-xl bg-gray-900/40 hover:bg-gray-900/70 border border-gray-800/80 transition-all overflow-hidden">
                            <span class="absolute left-0 top-0 bottom-0 w-1 ${style.bar}"></span>
                            <span class="font-mono text-[11px] text-indigo-400 font-bold w-16 shrink-0">${escapeHtml(code)}</span>
                            <span class="flex-1 text-xs text-gray-200 font-medium min-w-[140px]">${escapeHtml(offense)}</span>
                            <span class="hidden sm:flex items-center gap-1.5 text-[11px] text-gray-400 w-28 shrink-0">
                                <i class="fa-regular fa-clock text-[10px] text-gray-500"></i> ${escapeHtml(jail)}
                            </span>
                            <span class="hidden md:flex items-center gap-1.5 text-[11px] text-emerald-400 font-mono w-36 shrink-0 truncate" title="${escapeHtml(fine)}">
                                <i class="fa-solid fa-sack-dollar text-[10px] text-emerald-600"></i> ${escapeHtml(fine)}
                            </span>
                            <span class="inline-flex items-center justify-center px-2 py-1 rounded-full text-[10px] font-semibold border ${style.badge} shrink-0 whitespace-nowrap">
                                ${escapeHtml(level)}
                            </span>
                        </div>
                    `;
                }).join('');

                return `
                    <details class="group bg-police-card border border-police-border rounded-2xl shadow-xl overflow-hidden" ${q ? 'open' : ''}>
                        <summary class="cursor-pointer list-none px-6 py-4 flex items-center justify-between hover:bg-gray-900/50 transition-all select-none">
                            <div class="flex items-center gap-3">
                                <span class="w-8 h-8 rounded-xl bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 text-xs font-bold font-mono flex items-center justify-center">${escapeHtml(chapter.n)}</span>
                                <div>
                                    <h3 class="font-bold text-sm text-white group-hover:text-indigo-400 transition-colors">${escapeHtml(chapter.t)}</h3>
                                    <p class="text-[11px] text-gray-400">${escapeHtml(chapter.tth)} &mdash; ${rows.length} ${rows.length === 1 ? 'statute' : 'statutes'}</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-down text-xs text-gray-500 group-open:rotate-180 transition-transform"></i>
                        </summary>
                        <div class="p-4 pt-0 space-y-2 border-t border-police-border/50">
                            ${rowsHtml}
                        </div>
                    </details>
                `;
            }).join('');

            container.innerHTML = html || `
                <div class="bg-police-card border border-police-border p-12 text-center text-gray-500 rounded-2xl">
                    <i class="fa-solid fa-scale-unbalanced text-3xl mb-2 block opacity-40"></i>
                    No penal code section matched "${escapeHtml(filterText)}"
                </div>
            `;
        }

        function filterLawCodes() {
            const val = document.getElementById('law-search-input')?.value || '';
            renderLawChapters(val);
        }

        function renderInvestigationsTable(filterText = '') {
            const tbody = document.getElementById('investigations-table-body');
            if (!tbody) return;

            const cases = getStoredInvestigations().map(normalizeCase);
            const q = filterText.toLowerCase();
            const filtered = cases.filter(c => {
                const suspectNames = c.suspects.map(s => s.name).join(' ');
                return (c.id && c.id.toLowerCase().includes(q)) ||
                    (c.crimeType && c.crimeType.toLowerCase().includes(q)) ||
                    (c.leadDetective && c.leadDetective.toLowerCase().includes(q)) ||
                    suspectNames.toLowerCase().includes(q) ||
                    (c.location && c.location.toLowerCase().includes(q));
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="py-12 text-center text-gray-500">
                            <i class="fa-solid fa-magnifying-glass text-3xl mb-2 block opacity-40"></i>
                            No investigation case files found
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(c => {
                const statusColor = c.status.includes('ปิดคดี') ? 'text-emerald-400 border-emerald-500/30' :
                                    c.status.includes('หมดอายุความ') ? 'text-gray-400 border-gray-500/30' :
                                    'text-indigo-400 border-indigo-500/30';
                const suspectDisplay = c.suspects.length

        function quickUpdateStatus(id, newStatus) {
            const cases = getStoredInvestigations();

            localStorage.setItem(STORAGE_KEYS.INVESTIGATIONS, JSON.stringify(cases));
            renderInvestigationsTable(document.getElementById('investigation-search-input')?.value || '');
            showToast(`อัปเดตสถานะคดี #${id} เรียบร้อยแล้ว`, 'success');

        function collectRows(containerId, rowSelector, fieldMap) {
            const container = document.getElementById(containerId);
            if (!container) return [];
            return Array.from(container.querySelectorAll(rowSelector)).map(row => {
                const obj = {};
                Object.entries(fieldMap).forEach(([key, cls]) => {
                    obj[key] = row.querySelector('.' + cls)?.value.trim() || '';
                });
                return obj;
            }).filter(obj => Object.values(obj).some(v => v));
        }

                                </div>
                                <div id="crime-type-other-container" class="${c && c.crimeType === 'อื่นๆ' ? '' : 'hidden'}">
                                    <label class="block text-gray-400 font-semibold mb-1">- ระบุประเภทคดีอื่นๆ:</label>
                                    <input type="text" id="inv-crime-type-other" value="${escapeHtml(c ? c.crimeTypeOther : '')}" placeholder="ระบุประเภทคดี" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 focus:outline-none focus:border-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-gray-400 font-semibold mb-1">- สถานที่เกิดเหตุ (Location):</label>
                                    <input type="text" id="inv-location" required value="${escapeHtml(c ? c.location : '')}" placeholder="ระบุสถานที่เกิดเหตุ" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 focus:outline-none focus:border-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-gray-400 font-semibold mb-1">- วัน-เวลาที่เกิดเหตุ (Incident Date/Time):</label>
                                    <input type="text" id="inv-incident-datetime" required value="${escapeHtml(c ? c.incidentDateTime : '')}" placeholder="YYYY-MM-DD HH:MM" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 focus:outline-none focus:border-indigo-500">
                                </div>
                            </div>
                        </div>

                        <!-- [ ส่วนที่ 2: ข้อมูลผู้เกี่ยวข้อง (Involved Parties) ] -->
                        <div class="space-y-4">
                            <h3 class="text-sm font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-2 border-b border-gray-800 pb-2">
                                [ ส่วนที่ 2: ข้อมูลผู้เกี่ยวข้อง (Involved Parties) ]
                            </h3>
                            
                            <!-- Victims -->
                            <div class="space-y-2">
                                <div class="flex items-center justify-between">
                                    <label class="text-gray-300 font-semibold">1. ผู้เสียหาย / เหยื่อ (Victims)</label>
                                    <button type="button" onclick="addVictimRow()" class="px-2.5 py-1 bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 rounded-lg text-[11px] transition-all">
                                        <i class="fa-solid fa-plus"></i> เพิ่มผู้เสียหาย
                                    </button>
                                </div>
                                <div id="victims-container" class="space-y-2"></div>
                            </div>

                            <!-- Suspects -->
                            <div class="space-y-2 pt-2">
                                <div class="flex items-center justify-between">
                                    <label class="text-gray-300 font-semibold">2. ผู้ต้องสงสัย (Suspects)</label>
                                    <button type="button" onclick="addSuspectRow()" class="px-2.5 py-1 bg-amber-600/20 hover:bg-amber-600/40 text-amber-300 rounded-lg text-[11px] transition-all">
                                        <i class="fa-solid fa-plus"></i> เพิ่มผู้ต้องสงสัย
                                    </button>
                                </div>
                                <div id="suspects-container" class="space-y-2"></div>
                            </div>

                            <!-- Witnesses -->
                            <div class="space-y-2 pt-2">
                                <div class="flex items-center justify-between">
                                    <label class="text-gray-300 font-semibold">3. พยาน (Witnesses)</label>
                                    <button type="button" onclick="addWitnessRow()" class="px-2.5 py-1 bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 rounded-lg text-[11px] transition-all">
                                        <i class="fa-solid fa-plus"></i> เพิ่มพยาน
                                    </button>
                                </div>
                                <div id="witnesses-container" class="space-y-2"></div>
                            </div>
                        </div>

                        <!-- [ ส่วนที่ 3: รายละเอียดการสืบสวน (Investigative Details) ] -->
                        <div class="space-y-4">
                            <h3 class="text-sm font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-2 border-b border-gray-800 pb-2">
                                [ ส่วนที่ 3: รายละเอียดการสืบสวน (Investigative Details) ]
                            </h3>
                            <div>
                                <label class="block text-gray-400 font-semibold mb-1">- บันทึกย่อเหตุการณ์ (Case Summary):</label>
                                <textarea id="inv-summary" rows="3" required placeholder="สรุปภาพรวมเหตุการณ์ที่เกิดขึ้น..." class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 focus:outline-none focus:border-indigo-500">${escapeHtml(c ? c.summary : '')}</textarea>
                            </div>
                            <div>
                                <label class="block text-gray-400 font-semibold mb-1">- หลักฐานที่ยึดได้ (Evidence Collected):</label>
                                <textarea id="inv-evidence" rows="3" placeholder="รายการหลักฐานที่เก็บรวบรวมได้..." class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 focus:outline-none focus:border-indigo-500">${escapeHtml(c ? c.evidence : '')}</textarea>
                            </div>
                        </div>

                        <!-- [ ส่วนที่ 4: การดำเนินการและสรุปผล (Actions & Conclusion) ] -->
                        <div class="space-y-4">
                            <h3 class="text-sm font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-2 border-b border-gray-800 pb-2">
                                [ ส่วนที่ 4: การดำเนินการและสรุปผล (Actions & Conclusion) ]
                            </h3>
                            <div>
                                <label class="block text-gray-400 font-semibold mb-1">- ขั้นตอนการสืบสวนที่ทำไปแล้ว (เลือกรายการดำเนินการ):</label>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-gray-900/50 p-3 rounded-xl border border-gray-800 text-gray-300">
                                    ${[
                                        'ตรวจสอบกล้องวงจรปิด (CCTV)',
                                        'สอบปากคำพยานและผู้เกี่ยวข้อง',
                                        'ส่งพิสูจน์หลักฐาน / ลายนิ้วมือ',
                                        'ออกหมายจับผู้ต้องสงสัย',
                                        'เข้าตรวจค้นพื้นที่เป้าหมาย',
                                        'ประสานงานหน่วยงานที่เกี่ยวข้อง'
                                    ].map(act => {
                                        const checked = c && Array.isArray(c.actions) && c.actions.includes(act) ? 'checked' : '';
                                        return `
                                            <label class="flex items-center gap-2 cursor-pointer hover:text-white">
                                                <input type="checkbox" name="inv-action-cb" value="${escapeHtml(act)}" ${checked} class="rounded border-gray-700 bg-gray-900 text-indigo-600 focus:ring-indigo-500">
                                                <span>${escapeHtml(act)}</span>
                                            </label>
                                        `;
                                    }).join('')}
                                </div>
                            </div>

                            <div>
                                <label class="block text-gray-400 font-semibold mb-1">- บันทึกการสืบสวน / Timeline:</label>
                                <textarea id="inv-notes" rows="4" placeholder="ลำดับเหตุการณ์การสืบสวนเพิ่มเติม..." class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 focus:outline-none focus:border-indigo-500">${escapeHtml(c ? c.investigationNotes : '')}</textarea>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-gray-400 font-semibold mb-1">- สถานะคดีปัจจุบัน:</label>
                                    <select id="inv-status" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 focus:outline-none focus:border-indigo-500 cursor-pointer">
                                        ${CASE_STATUSES.map(s => `<option value="${escapeHtml(s)}" ${c && c.status === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-gray-400 font-semibold mb-1">- ลายมือชื่อผู้รายงาน:</label>
                                    <input type="text" id="inv-signature" required value="${escapeHtml(c ? (c.signature || c.leadDetective) : user.name)}" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 focus:outline-none focus:border-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-gray-400 font-semibold mb-1">- ตำแหน่ง:</label>
                                    <input type="text" id="inv-position" required value="${escapeHtml(c ? c.position : 'Lead Detective')}" class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 focus:outline-none focus:border-indigo-500">
                                </div>
                            </div>
                        </div>

                        <!-- Form Submission -->
                        <div class="pt-4 border-t border-gray-800 flex justify-end gap-3">
                            <button type="button" onclick="setActiveTab('investigation-list')" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-white font-semibold rounded-xl transition-all">
                                Cancel
                            </button>
                            <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2">
                                <i class="fa-solid fa-floppy-disk"></i> ${isEdit ? 'Update Case File' : 'Save Investigation Report'}
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function initFormEvents(editId) {
            const existing = editId ? getStoredInvestigations().find(c => c.id === editId) : null;
            const c = existing ? normalizeCase(existing) : null;

            const vContainer = document.getElementById('victims-container');
            const sContainer = document.getElementById('suspects-container');
            const wContainer = document.getElementById('witnesses-container');

            if (c && c.victims.length) {
                c.victims.forEach(v => vContainer.insertAdjacentHTML('beforeend', victimRowHTML(v)));
            } else {
                addVictimRow();
            }

            if (c && c.suspects.length) {
                c.suspects.forEach(s => sContainer.insertAdjacentHTML('beforeend', suspectRowHTML(s)));
            } else {
                addSuspectRow();
            }

            if (c && c.witnesses.length) {
                c.witnesses.forEach(w => wContainer.insertAdjacentHTML('beforeend', witnessRowHTML(w)));
            } else {
                addWitnessRow();
            }
        }

        function toggleCrimeTypeOther() {
            const sel = document.getElementById('inv-crime-type').value;
            const container = document.getElementById('crime-type-other-container');
            if (sel === 'อื่นๆ') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function handleCreateInvestigation(e, editId) {
            e.preventDefault();

            const victims = collectRows('victims-container', '.victim-row', {
                name: 'victim-name',
                contact: 'victim-contact',
                role: 'victim-role',
                injury: 'victim-injury'
            });

            const suspects = collectRows('suspects-container', '.suspect-row', {
                name: 'suspect-name',
                description: 'suspect-description',
                contact: 'suspect-contact',
                locationSeen: 'suspect-location'
            });

            const witnesses = collectRows('witnesses-container', '.witness-row', {
                name: 'witness-name',
                contact: 'witness-contact',
                statement: 'witness-statement'
            });

            const cbElements = document.querySelectorAll('input[name="inv-action-cb"]:checked');
            const actions = Array.from(cbElements).map(cb => cb.value);

            const caseData = {
                id: document.getElementById('inv-case-id').value,
                reportDate: document.getElementById('inv-report-date').value,
                leadDetective: document.getElementById('inv-lead-detective').value,
                assistingOfficers: document.getElementById('inv-assisting-officers').value,
                crimeType: document.getElementById('inv-crime-type').value,
                crimeTypeOther: document.getElementById('inv-crime-type-other')?.value || '',
                location: document.getElementById('inv-location').value,
                incidentDateTime: document.getElementById('inv-incident-datetime').value,
                victims: victims,
                suspects: suspects,
                witnesses: witnesses,
                summary: document.getElementById('inv-summary').value,
                evidence: document.getElementById('inv-evidence').value,
                actions: actions,
                investigationNotes: document.getElementById('inv-notes').value,
                status: document.getElementById('inv-status').value,
                signature: document.getElementById('inv-signature').value,
                position: document.getElementById('inv-position').value
            };

            let cases = getStoredInvestigations();
            if (editId) {
                const idx = cases.findIndex(c => c.id === editId);
                if (idx !== -1) {
                    cases[idx] = caseData;
                } else {
                    cases.unshift(caseData);
                }
                showToast(`อัปเดตแฟ้มคดี #${caseData.id} เรียบร้อยแล้ว`, 'success');
            } else {
                cases.unshift(caseData);
                showToast(`สร้างแฟ้มคดีใหม่ #${caseData.id} เรียบร้อยแล้ว`, 'success');
            }

            localStorage.setItem(STORAGE_KEYS.INVESTIGATIONS, JSON.stringify(cases));
            setActiveTab('investigation-list');
        }

        // Initialize App
        function renderApp() {
            const user = getCurrentUser();
            if (user) {
                renderDashboardView();
            } else {
                renderAuthView();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeStorage();
            renderApp();
        });
    </script>
</body>
</html>
